<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://animesubstudio-256ec.web.app/">
    <meta property="og:title" content="Anime Sub Studio | Watch Hindi Subbed Anime & K-Dramas">
    <meta property="og:description" content="Your hub for Hindi Subbed & Dubbed Anime, K-Dramas, Movies & Web Series.">
    <meta property="og:url" content="https://animesubstudio-256ec.web.app/">
    <meta property="og:type" content="website">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Anime Sub Studio",
        "url": "https://animesubstudio-256ec.web.app/",
        "description": "Best site for Hindi Subbed Anime, K-Dramas, Movies & Web Series.",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://animesubstudio-256ec.web.app/?search={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header>
    <a href="index.html" class="logo">ANIME <span>SUB STUDIO</span></a>
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="mainSearch" placeholder="Search anime, drama, movies...">
    </div>
</header>

<div class="master-layout">
    <aside class="sidebar">
        <div class="widget">
            <div class="widget-title">Categories</div>
            <div id="catList">
                <button class="cat-btn active" onclick="filterData('All', this)">All Updates</button>
                <button class="cat-btn" onclick="filterData('Short Video', this)">Short Videos</button>
                <button class="cat-btn" onclick="filterData('Anime', this)">Anime</button>
                <button class="cat-btn" onclick="filterData('K-Drama', this)">K-Dramas</button>
                <button class="cat-btn" onclick="filterData('Movie', this)">Movies</button>
                <button class="cat-btn" onclick="filterData('Series', this)">Web Series</button>
            </div>
        </div>
        <div class="widget">
            <div class="widget-title">A-Z Directory</div>
            <div class="az-grid" id="azGrid">
                <button class="az-btn active" onclick="filterLetter('All', this)">ALL</button>
                <button class="az-btn" onclick="filterLetter('0-9', this)">0-9</button>
            </div>
        </div>
    </aside>
    <main class="main-view">
        <div class="anime-grid" id="gridDisplay"></div>
    </main>
</div>

<div class="social-footer">
    <a href="https://t.me/hindisubinganime" target="_blank" class="btn-tg"><i class="fab fa-telegram"></i> Join Channel</a>
    <a href="https://t.me/hindisubanime_q" target="_blank" class="btn-gc"><i class="fas fa-comments"></i> Discussion</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A",
        authDomain: "animesubstudio-256ec.firebaseapp.com",
        projectId: "animesubstudio-256ec",
        storageBucket: "animesubstudio-256ec.firebasestorage.app",
        messagingSenderId: "439418566080",
        appId: "1:439418566080:web:6c27313bb4f2e76a2a4425"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allData = [];

    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
        document.getElementById('azGrid').innerHTML += `<button class="az-btn" onclick="filterLetter('${l}', this)">${l}</button>`;
    });

    async function loadData() {
        const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
        allData = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allData);
    }

    window.render = (list) => {
        const grid = document.getElementById('gridDisplay');
        if(list.length === 0) {
            grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--text-light);">No Content Found! Admin, add posts from the Admin Panel.</p>';
            return;
        }
        grid.innerHTML = list.map(a => `
            <div class="anime-card" onclick="location.href='detail.html?id=${a.id}'">
                <div class="type-tag">${a.type}</div>
                <img src="${a.image}" alt="${a.name}" loading="lazy">
                <div class="card-details">
                    <h3>${a.name}</h3>
                    <div style="font-size:0.8rem; color:var(--accent); margin-top:0.25rem;">${a.genre}</div>
                </div>
            </div>
        `).join('');
    };

    window.filterData = (type, btn) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(type === 'All' ? allData : allData.filter(a => a.type === type));
    };

    window.filterLetter = (l, btn) => {
        document.querySelectorAll('.az-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(l === 'All') render(allData);
        else if(l === '0-9') render(allData.filter(a => /^\d/.test(a.name)));
        else render(allData.filter(a => a.name.toUpperCase().startsWith(l)));
    };

    document.getElementById('mainSearch').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        render(allData.filter(a => a.name.toLowerCase().includes(val) || a.genre.toLowerCase().includes(val)));
    };

    loadData();
</script>
</body>
</html>
