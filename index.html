<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Sub Studio | Watch Anime & K-Drama</title>
    <link rel="stylesheet" href="style.css">
    <style>
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--card); border-bottom: 1px solid var(--border); }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .search-bar { width: 300px; }
        .filters { display: flex; gap: 10px; padding: 20px 5%; overflow-x: auto; white-space: nowrap; }
        .filters button { background: var(--card); border: 1px solid var(--border); color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .filters button.active, .filters button:hover { background: var(--primary); border-color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 0 5%; }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .card img { width: 100%; height: 240px; object-fit: cover; }
        .card-info { padding: 12px; }
        .card-info h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { font-size: 10px; background: var(--primary); padding: 3px 8px; border-radius: 5px; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">HINDI SUB <span>STUDIO</span></a>
    <input type="text" id="searchInput" class="search-bar" placeholder="Deep Search Anime, K-Drama..." style="margin:0;">
</header>

<div class="filters">
    <button class="active" onclick="filterType('All', this)">All</button>
    <button onclick="filterType('Anime Hindi Sub', this)">Anime Sub</button>
    <button onclick="filterType('Anime Hindi Dub', this)">Anime Dub</button>
    <button onclick="filterType('K-Drama', this)">K-Drama</button>
    <button onclick="filterType('Series', this)">Web Series</button>
    <button onclick="filterType('Donghua', this)">Donghua</button>
    <button onclick="filterType('Movie', this)">Movies</button>
</div>

<div class="grid" id="postGrid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A", authDomain: "animesubstudio-256ec.firebaseapp.com",
        projectId: "animesubstudio-256ec", storageBucket: "animesubstudio-256ec.firebasestorage.app",
        messagingSenderId: "439418566080", appId: "1:439418566080:web:6c27313bb4f2e76a2a4425"
    });
    const db = getFirestore(app);
    let allData = [];

    async function load() {
        const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
        allData = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allData);
    }

    function render(list) {
        document.getElementById('postGrid').innerHTML = list.map(p => `
            <div class="card" onclick="location.href='detail.html?id=${p.id}'">
                <img src="${p.image}" loading="lazy">
                <div class="card-info">
                    <h4>${p.name}</h4>
                    <span class="badge">${p.type}</span>
                </div>
            </div>
        `).join('');
    }

    window.filterType = (type, btn) => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        render(type === 'All' ? allData : allData.filter(p => p.type.includes(type)));
    };

    document.getElementById('searchInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        render(allData.filter(p => p.name.toLowerCase().includes(val) || p.genre.toLowerCase().includes(val)));
    };
    load();
</script>
</body>
</html>
