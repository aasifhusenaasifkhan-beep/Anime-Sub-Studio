<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hindi Sub Studio | Free Anime & K-Drama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">HINDI SUB <span>STUDIO</span></a>
        <div class="search-box">
            <input id="searchInput" placeholder="Search Anime, K-Drama, Movies...">
        </div>
    </header>

    <!-- SAARI 12 CATEGORIES -->
    <div class="filter-container">
        <button onclick="filterData('All', this)" class="active">All Updates</button>
        <button onclick="filterData('Anime Hindi Sub', this)">Anime Hindi Sub</button>
        <button onclick="filterData('Anime Hindi Dub', this)">Anime Hindi Dub</button>
        <button onclick="filterData('Anime English Sub', this)">Anime English Sub</button>
        <button onclick="filterData('Anime English Dub', this)">Anime English Dub</button>
        <button onclick="filterData('K-Drama Hindi Sub', this)">K-Drama Hindi Sub</button>
        <button onclick="filterData('K-Drama Hindi Dub', this)">K-Drama Hindi Dub</button>
        <button onclick="filterData('Series Hindi Sub', this)">Series Hindi Sub</button>
        <button onclick="filterData('Series Hindi Dub', this)">Series Hindi Dub</button>
        <button onclick="filterData('Donghua Hindi Sub', this)">Donghua Hindi Sub</button>
        <button onclick="filterData('Donghua Hindi Dub', this)">Donghua Hindi Dub</button>
        <button onclick="filterData('Movie Hindi Sub', this)">Movie Hindi Sub</button>
        <button onclick="filterData('Movie Hindi Dub', this)">Movie Hindi Dub</button>
    </div>

    <main id="animeList" class="anime-list">
        <h3 style="color:var(--primary); text-align:center; width:100%;">Loading...</h3>
    </main>

    <div class="social-footer">
        <a href="https://t.me/hindisubinganime" target="_blank" style="background:#0088cc;">Telegram Channel</a>
        <a href="https://t.me/hindisubanime_q" target="_blank" style="background:#333;">Discussion Group</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A", authDomain: "animesubstudio-256ec.firebaseapp.com",
            projectId: "animesubstudio-256ec", storageBucket: "animesubstudio-256ec.firebasestorage.app",
            messagingSenderId: "439418566080", appId: "1:439418566080:web:6c27313bb4f2e76a2a4425"
        });
        const db = getFirestore(app);
        let allData =[];

        async function load() {
            const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
            allData = snap.docs.map(d => ({id: d.id, ...d.data()}));
            render(allData);
        }

        function render(list) {
            const box = document.getElementById("animeList");
            if(list.length === 0) return box.innerHTML = "<p style='width:100%; text-align:center;'>No Content Found.</p>";
            box.innerHTML = list.map(a => `
                <div class="anime-card" onclick="location.href='detail.html?id=${a.id}'">
                    <div class="badge-type">${a.type}</div>
                    <img src="${a.image}" loading="lazy">
                    <div class="anime-info">
                        <h4>${a.name}</h4>
                        <span style="font-size:12px; color:gray;">${a.genre} | ${a.date}</span>
                    </div>
                </div>
            `).join('');
        }

        window.filterData = (type, btn) => {
            document.querySelectorAll(".filter-container button").forEach(b => b.classList.remove("active")); btn.classList.add("active");
            render(type === 'All' ? allData : allData.filter(a => a.type === type));
        };

        document.getElementById("searchInput").addEventListener("input", e => {
            const val = e.target.value.toLowerCase();
            render(allData.filter(a => a.name.toLowerCase().includes(val) || a.genre.toLowerCase().includes(val)));
        });

        load();
    </script>
</body>
</html>
