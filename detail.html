<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Now | Anime Sub Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .unlock-box { text-align: center; padding: 3rem; background: var(--card); border-radius: 12px; border: 2px solid var(--accent); max-width: 500px; margin: 3rem auto; box-shadow: var(--shadow); }
        .unlock-box i { font-size: 3rem; color: var(--accent); margin-bottom: 1rem; }
        .unlock-box p a { color: #0088cc; }
    </style>
</head>
<body>
<header><a href="index.html" class="logo">ANIME <span>SUB STUDIO</span></a></header>

<div class="master-layout" style="flex-direction:column; max-width:1100px; margin:auto;">

    <div style="display:flex; gap:1.5rem; flex-wrap:wrap; margin-bottom:1.5rem;">
        <img id="pImg" style="width:200px; border-radius:12px; border:1px solid var(--border); box-shadow: var(--shadow);" alt="Poster">
        <div style="flex:1;">
            <h1 id="pName" style="margin:0; color:var(--accent); font-size:2rem;">Loading...</h1>
            <p id="pMeta" style="color:var(--text-light); margin:0.5rem 0; font-weight:600;"></p>
            <p id="pStory" style="background:var(--card); padding:1rem; border-radius:8px; border:1px solid var(--border); color:var(--text);"></p>
        </div>
    </div>

    <!-- Password Lock -->
    <div id="lockArea" class="unlock-box">
        <i class="fas fa-lock"></i>
        <h2>Video Locked</h2>
        <p style="margin:0.5rem 0; color:var(--text-light);">Join our Telegram group to get the password.</p>
        <p><a href="https://t.me/hindisubanime_q" target="_blank" style="color:#0088cc; font-weight:bold;">📢 @hindisubanime_q</a></p>
        <input type="password" id="globalPass" placeholder="Enter Password" style="max-width:300px; margin:0 auto; text-align:center; background:white;">
        <button class="btn-save" onclick="unlockVideo()" style="margin-top:0.5rem;">Unlock Now</button>
        <p id="msg" style="color:red; font-weight:bold; margin-top:0.5rem;"></p>
    </div>

    <!-- Video Section (hidden until unlocked) -->
    <div id="videoSection" style="display:none;">
        <div class="player-box">
            <iframe id="videoPlayer" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="widget">
            <div class="widget-title">📺 Episodes</div>
            <div id="epGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:0.75rem;"></div>
        </div>

        <div class="premium-shield">
            <h3 style="color:var(--accent); margin-bottom:0.5rem;">🔓 Unlock Download Link</h3>
            <p style="color:var(--text-light); font-size:0.9rem;">Enter your premium token for direct download. Free users will use a shortener.</p>
            <input type="text" id="tokenInput" placeholder="Premium Token" style="max-width:300px; margin:0.5rem auto; text-align:center; background:white;">
            <button class="btn-save" onclick="checkAccess()">Get Download Link</button>
            <div id="dlArea" style="margin-top:1rem;"></div>
        </div>
    </div>
</div>

<div class="social-footer">
    <a href="https://t.me/hindisubinganime" target="_blank" class="btn-tg"><i class="fab fa-telegram"></i> Channel</a>
    <a href="https://t.me/hindisubanime_q" target="_blank" class="btn-gc"><i class="fas fa-comments"></i> Group</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A",
        authDomain: "animesubstudio-256ec.firebaseapp.com",
        projectId: "animesubstudio-256ec",
        storageBucket: "animesubstudio-256ec.firebasestorage.app",
        messagingSenderId: "439418566080",
        appId: "1:439418566080:web:6c27313bb4f2e76a2a4425"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    let selectedDownloadLink = null;

    window.unlockVideo = async () => {
        const pass = document.getElementById('globalPass').value.trim();
        const msg = document.getElementById('msg');
        if(!pass) { msg.innerText = 'Enter password!'; return; }
        const snap = await getDoc(doc(db, "settings", "sitePassword"));
        if(snap.exists() && snap.data().password === pass) {
            sessionStorage.setItem('site_unlocked', 'true');
            document.getElementById('lockArea').style.display = 'none';
            document.getElementById('videoSection').style.display = 'block';
            loadContent();
        } else {
            msg.innerText = 'Wrong password! Join @hindisubanime_q for the password.';
        }
    };

    if(sessionStorage.getItem('site_unlocked') === 'true') {
        document.getElementById('lockArea').style.display = 'none';
        document.getElementById('videoSection').style.display = 'block';
    }

    async function loadContent() {
        if(!postId) return;
        const snap = await getDoc(doc(db, "posts", postId));
        if(!snap.exists()) return;
        const d = snap.data();
        document.getElementById('pName').innerText = d.name;
        document.getElementById('pImg').src = d.image;
        document.getElementById('pStory').innerText = d.story || '';
        document.getElementById('pMeta').innerText = `${d.genre} | ${d.date || ''} | ${d.type}`;
        const epSnap = await getDocs(query(collection(db, "episodes"), where("postId", "==", postId)));
        const eps = epSnap.docs.map(e => e.data()).sort((a,b) => parseFloat(a.num) - parseFloat(b.num));
        const grid = document.getElementById('epGrid');
        grid.innerHTML = eps.map(e => `
            <div class="ep-node" onclick="playEpisode('${e.stream}', '${e.download}')">Ep ${e.num}</div>
        `).join('');
        if(eps.length > 0) playEpisode(eps[0].stream, eps[0].download);
    }

    window.playEpisode = (streamUrl, dlUrl) => {
        document.getElementById('videoPlayer').src = streamUrl;
        selectedDownloadLink = dlUrl;
        document.getElementById('dlArea').innerHTML = '';
    };

    window.checkAccess = async () => {
        if(!selectedDownloadLink) {
            document.getElementById('dlArea').innerHTML = '<span style="color:red;">Select an episode first.</span>';
            return;
        }
        const token = document.getElementById('tokenInput').value.trim();
        const area = document.getElementById('dlArea');
        area.innerHTML = 'Checking...';
        if(token) {
            const tSnap = await getDocs(query(collection(db, "premium"), where("token", "==", token)));
            if(!tSnap.empty) {
                const tData = tSnap.docs[0].data();
                if(tData.expiry > Date.now()) {
                    let devId = localStorage.getItem('device_id');
                    if(!devId) { devId = "DEV-" + Math.random().toString(36).substr(2,10); localStorage.setItem('device_id', devId); }
                    if(!tData.lockedDevice || tData.lockedDevice === devId) {
                        if(!tData.lockedDevice) await setDoc(doc(db, "premium", tSnap.docs[0].id), { lockedDevice: devId }, { merge: true });
                        area.innerHTML = `<a href="${selectedDownloadLink}" target="_blank" class="btn-save" style="background:#16a34a; display:inline-block; text-decoration:none;">✅ Direct Download</a>`;
                        return;
                    } else { area.innerHTML = '<span style="color:red;">Token locked to another device.</span>'; return; }
                } else { area.innerHTML = '<span style="color:red;">Token expired.</span>'; return; }
            } else { area.innerHTML = '<span style="color:red;">Invalid token.</span>'; return; }
        }
        try {
            const setSnap = await getDoc(doc(db, "settings", "shorteners"));
            if(!setSnap.exists()) { area.innerHTML = 'Shorteners not configured.'; return; }
            const list = setSnap.data().list;
            const r = list[Math.floor(Math.random() * list.length)];
            const apiUrl = `${r.url}?api=${r.key}&url=${encodeURIComponent(selectedDownloadLink)}&format=text`;
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`);
            const short = await res.text();
            if(short && short.startsWith('http')) {
                area.innerHTML = `<button onclick="submitForm('${short}')" class="btn-save">📥 Download via Shortener</button>`;
            } else { area.innerHTML = 'Shortener error.'; }
        } catch(e) { area.innerHTML = 'Network error.'; }
    };

    window.submitForm = (url) => {
        const f = document.createElement('form'); f.method='GET'; f.action=url; f.target='_blank';
        document.body.appendChild(f); f.submit(); document.body.removeChild(f);
    };

    if(sessionStorage.getItem('site_unlocked') === 'true') loadContent();
</script>
</body>
</html>
