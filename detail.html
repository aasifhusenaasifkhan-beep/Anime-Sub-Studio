<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details | Hindi Sub Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-box { display: flex; gap: 30px; padding: 40px 5%; max-width: 1000px; margin: auto; }
        .detail-img { width: 250px; height: 350px; object-fit: cover; border-radius: 15px; border: 2px solid var(--primary); }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
        .ep-btn { background: var(--card); border: 1px solid var(--border); padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .ep-btn:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="detail-box" id="contentBox">Loading...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A", authDomain: "animesubstudio-256ec.firebaseapp.com",
        projectId: "animesubstudio-256ec", storageBucket: "animesubstudio-256ec.firebasestorage.app",
        messagingSenderId: "439418566080", appId: "1:439418566080:web:6c27313bb4f2e76a2a4425"
    });
    const db = getFirestore(app);
    const id = new URLSearchParams(window.location.search).get('id');

    async function load() {
        if(!id) return;
        const pSnap = await getDoc(doc(db, "posts", id));
        const eSnap = await getDocs(query(collection(db, "episodes"), where("postId", "==", id)));
        
        if(pSnap.exists()) {
            const p = pSnap.data();
            const eps = eSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.num - b.num);
            
            let epsHtml = eps.map(e => `<div class="ep-btn" onclick="location.href='watch.html?epId=${e.id}'">Episode ${e.num}</div>`).join('');
            if(eps.length === 0) epsHtml = "<p style='color:gray;'>Episodes coming soon!</p>";

            document.getElementById('contentBox').innerHTML = `
                <img src="${p.image}" class="detail-img">
                <div>
                    <h1 style="color:var(--primary); margin-bottom:10px;">${p.name}</h1>
                    <p style="color:var(--text-dim); margin-bottom:20px;"><strong>Genre:</strong> ${p.genre} | <strong>Year:</strong> ${p.date} | <strong>Type:</strong> ${p.type}</p>
                    <p style="background:var(--card); padding:15px; border-radius:10px; line-height:1.6;">${p.story}</p>
                    <h3 style="margin-top:30px;">Select Episode to Watch:</h3>
                    <div class="ep-grid">${epsHtml}</div>
                </div>
            `;
        }
    }
    load();
</script>
</body>
</html>
