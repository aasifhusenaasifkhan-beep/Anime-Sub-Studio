<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch Online | Hindi Sub Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .unlock-box { display: none; background: #111; padding: 25px; border-radius: 12px; margin-top: 20px; border: 1px dashed var(--primary); text-align: center; }
        .unlock-box input { width: 70%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; outline: none; text-align: center; }
    </style>
</head>
<body>

    <header><a href="index.html" class="logo">HINDI SUB <span>STUDIO</span></a></header>
    <a href="index.html" style="color:var(--primary); text-decoration:none; margin:20px; display:inline-block; font-weight:bold;">← Back to Home</a>

    <!-- MAIN DETAIL BOX -->
    <div id="detailBox">
        <h3 style="color:white; text-align:center; padding:50px;">Loading Data...</h3>
    </div>

    <!-- INLINE PASSWORD BOX (NO POPUPS) -->
    <div id="unlockBox" class="unlock-box" style="max-width:800px; margin:20px auto;">
        <h3 style="color:var(--primary); margin-bottom:10px;">🔒 Locked Episode</h3>
        <p style="color:#aaa; font-size:13px; margin-bottom:15px;">Enter today's daily password to watch and download.</p>
        <input type="text" id="epPassInput" placeholder="Enter Password Here">
        <br>
        <button class="btn-main" style="width:70%;" onclick="submitPass()">Unlock Now</button>
        <p style="margin-top:15px; font-size:13px;">
            <a href="https://t.me/hindisubinganime" target="_blank" style="color:var(--primary); text-decoration:none; font-weight:bold;">👉 Click Here to Get Password from Telegram</a>
        </p>
    </div>

    <!-- PLAYER & DOWNLOAD SECTION (HIDDEN INITIALLY) -->
    <div id="playerArea" class="player-box" style="max-width:1000px; margin:20px auto;">
        <h3 style="color:var(--primary); margin-bottom:15px;" id="playingTitle">Playing Episode</h3>
        
        <iframe id="vidPlayer" allowfullscreen></iframe>
        
        <div class="download-box">
            <h3 style="color:white; text-align:center; margin-bottom:15px;">📥 Download Episode</h3>
            
            <!-- VIP DOWNLOAD -->
            <div style="background:#111; padding:20px; border-radius:10px; border:1px solid gold; text-align:center;">
                <h4 style="color:gold; margin-bottom:10px;">💎 Premium VIP Download</h4>
                <input type="text" id="vipToken" placeholder="Enter VIP Token" style="padding:10px; width:60%; border-radius:5px; border:none; text-align:center; margin-bottom:10px;">
                <br>
                <button class="btn-main btn-green" style="width:60%;" onclick="verifyVIP()">Direct Download (Ad-Free)</button>
            </div>

            <p style="text-align:center; margin:15px 0; font-weight:bold; color:#aaa;">OR</p>

            <!-- FREE DOWNLOAD -->
            <button class="btn-main" id="freeBtn" onclick="generateLink()">Free Download (via Shortener)</button>
            <p id="freeMsg" style="text-align:center; color:var(--primary); margin-top:10px; font-weight:bold;"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // FIREBASE SETUP
        const app = initializeApp({ apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A", authDomain: "animesubstudio-256ec.firebaseapp.com", projectId: "animesubstudio-256ec", storageBucket: "animesubstudio-256ec.firebasestorage.app", messagingSenderId: "439418566080", appId: "1:439418566080:web:6c27313bb4f2e76a2a4425" });
        const db = getFirestore(app);
        
        const postId = new URLSearchParams(window.location.search).get('id');
        let globalPass = "";
        let shorteners =[];
        let currentEpData = null;

        async function load() {
            if(!postId) {
                document.getElementById("detailBox").innerHTML = "<h3 style='color:red; text-align:center;'>Error: Post ID Missing!</h3>";
                return;
            }
            
            // Get Master Settings
            const sSnap = await getDoc(doc(db, "settings", "main"));
            if(sSnap.exists()){ globalPass = sSnap.data().globalPassword; shorteners = sSnap.data().shorteners ||[]; }

            // Get Post Info
            const pSnap = await getDoc(doc(db, "posts", postId));
            const eSnap = await getDocs(query(collection(db, "episodes"), where("postId", "==", postId)));
            
            if (pSnap.exists()) {
                const p = pSnap.data();
                const eps = eSnap.docs.map(d => d.data()).sort((a,b) => parseFloat(a.num) - parseFloat(b.num));
                
                let epsHtml = eps.map(e => `
                    <div class="ep-btn" onclick="playEpisode('${e.num}', '${e.live}', '${e.down}')">Episode ${e.num}</div>
                `).join('');

                if(eps.length === 0) epsHtml = "<p style='color:gray;'>No Episodes uploaded yet.</p>";

                document.getElementById("detailBox").innerHTML = `
                    <div class="detail-container">
                        <img src="${p.image}" class="detail-img">
                        <div class="detail-info">
                            <h1 style="color:var(--primary);">${p.name}</h1>
                            <p style="color:var(--text-muted); margin:10px 0; font-size:14px; font-weight:bold;">${p.genre} | ${p.type} | ${p.date}</p>
                            <p style="background:#111; padding:15px; border-radius:10px; margin-bottom:20px; color:#ccc; line-height:1.6; font-size:14px;">${p.story}</p>
                            
                            <h3 style="margin-bottom:10px;">📺 Select Episode:</h3>
                            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px;">
                                ${epsHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById("detailBox").innerHTML = "<h3 style='color:red; text-align:center;'>Post Not Found!</h3>";
            }
        }

        // --- PASSWORD SYSTEM (NO POPUPS, 100% WORKING) ---
        window.playEpisode = (num, liveUrl, downUrl) => {
            currentEpData = { live: liveUrl, down: downUrl, num: num };
            
            // Agar pehle hi password daal chuka hai (session active)
            if(sessionStorage.getItem('hss_unlocked') === 'true') {
                showPlayer();
            } else {
                // Password box dikhao
                document.getElementById('unlockBox').style.display = 'block';
                document.getElementById('playerArea').style.display = 'none';
                window.scrollTo({ top: document.getElementById('unlockBox').offsetTop, behavior: 'smooth' });
            }
        };

        window.submitPass = () => {
            const pass = document.getElementById('epPassInput').value.trim();
            if(pass === globalPass) {
                sessionStorage.setItem('hss_unlocked', 'true'); // Save session
                document.getElementById('unlockBox').style.display = 'none'; // Hide box
                showPlayer(); // Show Video
            } else {
                alert("❌ Wrong Password! Please join Telegram to get today's password.");
            }
        };

        function showPlayer() {
            document.getElementById('playerArea').style.display = 'block';
            document.getElementById('playingTitle').innerText = "▶️ Playing: Episode " + currentEpData.num;
            document.getElementById('vidPlayer').src = currentEpData.live; // Play SeekStreaming Link
            window.scrollTo({ top: document.getElementById('playerArea').offsetTop - 20, behavior: 'smooth' });
        }

        // --- VIP PREMIUM LOGIC ---
        window.verifyVIP = async () => {
            const token = document.getElementById('vipToken').value.trim();
            if(!token) return alert('Please enter VIP Token!');

            let devId = localStorage.getItem('hss_dev');
            if(!devId) { devId = "D-" + Math.random().toString(36).substr(2,10); localStorage.setItem('hss_dev', devId); }

            const snap = await getDocs(query(collection(db, "premium"), where("token", "==", token)));
            if(!snap.empty) {
                const data = snap.docs[0].data();
                if(data.expiry < Date.now()) return alert('❌ Token Expired!');
                if(!data.lockedDevice || data.lockedDevice === devId) {
                    if(!data.lockedDevice) await setDoc(doc(db, "premium", snap.docs[0].id), { lockedDevice: devId }, { merge: true });
                    window.open(currentEpData.down, "_blank"); // Open direct link
                } else alert('❌ Fraud Detected! Token is locked to another device.');
            } else alert('❌ Invalid VIP Token!');
        };

        // --- FREE SHORTENER LOGIC (YOUR ORIGINAL BYPASS METHOD) ---
        function makeUniqueUrl(original) {
            const hashIndex = original.indexOf('#');
            let hash = "", base = original;
            if (hashIndex !== -1) { hash = original.substring(hashIndex); base = original.substring(0, hashIndex); }
            const dailyId = Math.floor(Date.now() / 86400000);
            return base + (base.includes('?') ? '&' : '?') + "asi_uid=" + dailyId + hash;
        }

        window.generateLink = async () => {
            const btn = document.getElementById('freeBtn');
            const msg = document.getElementById('freeMsg');
            
            if(shorteners.length === 0) {
                msg.innerText = "❌ Admin has not setup Shortener API yet!";
                return;
            }
            
            btn.innerText = "⏳ Generating Secure Link..."; 
            btn.disabled = true;
            msg.innerText = "";

            const rand = shorteners[Math.floor(Math.random() * shorteners.length)];
            const bypassedLink = makeUniqueUrl(currentEpData.down);
            
            let apiBase = rand.url.trim();
            if(!apiBase.startsWith('http')) apiBase = 'https://' + apiBase;
            if(!apiBase.endsWith('/api')) apiBase += '/api';

            const apiUrl = `${apiBase}?api=${rand.key.trim()}&url=${encodeURIComponent(bypassedLink)}&format=text`;

            try {
                // Try Proxy Fetch
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;
                const res = await fetch(proxyUrl);
                const finalLink = await res.text();

                if(finalLink && finalLink.startsWith('http')) {
                    // Force open via hidden form to prevent Adblocker pop-up block
                    const form = document.createElement('form');
                    form.method = "GET"; form.action = finalLink.trim(); form.target = "_blank";
                    document.body.appendChild(form); form.submit(); document.body.removeChild(form);
                    
                    msg.innerText = "✅ Link Opened Successfully!";
                } else {
                    msg.innerText = "❌ API Error. Check Admin Panel Keys.";
                }
            } catch(e) {
                msg.innerText = "❌ Network Error. Please Turn Off Ad-Blocker.";
            } finally {
                btn.innerText = "Free Download (via Shortener)"; 
                btn.disabled = false;
            }
        };

        // Start Process
        load();
    </script>
</body>
</html>
