<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Online | Anime Sub Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header><a href="index.html" class="logo">ANIME <span>SUB STUDIO</span></a></header>

<div class="master-layout" style="flex-direction:column; max-width:1100px; margin:auto;">
    <div class="player-box">
        <iframe id="videoPlayer" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
    </div>

    <div style="display:flex; gap:25px; flex-wrap:wrap;">
        <img id="pImg" style="width:200px; border-radius:12px; border:1px solid var(--border);">
        <div style="flex:1;">
            <h1 id="pName" style="margin:0; color:var(--primary); font-size:30px;">Loading...</h1>
            <p id="pMeta" style="color:var(--text-dim); margin:10px 0; font-weight:bold;"></p>
            <p id="pStory" style="line-height:1.7; background:var(--card); padding:15px; border-radius:10px; border:1px solid var(--border); color:#ccc;"></p>
        </div>
    </div>

    <div class="widget" style="margin-top:20px;">
        <div class="widget-title">📺 Select Episode</div>
        <div id="epGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px;"></div>
    </div>

    <div class="premium-shield">
        <h2 style="color:var(--primary); margin:0 0 10px 0;">🚀 Premium / Free Download</h2>
        <p style="color:var(--text-dim); font-size:13px; margin-bottom:20px;">Enter Telegram ID for Ads-Free Direct Links. Free users will use Shortener.</p>
        <input type="text" id="tgId" placeholder="Enter Telegram ID" style="max-width:300px; text-align:center; padding:12px; border-radius:8px;">
        <button class="btn-save" style="width:auto; padding:12px 30px;" onclick="checkAccess()">Verify & Download</button>
        <div id="dlArea" style="margin-top:20px;"></div>
    </div>
</div>

<div class="social-footer">
    <a href="https://t.me/hindisubinganime" target="_blank" class="btn-tg"><i class="fab fa-telegram"></i> Free Channel</a>
    <a href="https://t.me/hindisubanime_q" target="_blank" class="btn-gc"><i class="fas fa-comments"></i> Discussion Group</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBhDMFJS5CuQN5H8T_FuSWzz8xau2qSv0I",
        authDomain: "animesubstudio.firebaseapp.com",
        projectId: "animesubstudio",
        storageBucket: "animesubstudio.firebasestorage.app",
        messagingSenderId: "580159107279",
        appId: "1:580159107279:web:8e5ea97ea6b591336947ba"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const id = new URLSearchParams(window.location.search).get('id');
    let selectedEpData = null;

    async function load() {
        if(!id) return;
        const snap = await getDoc(doc(db, "posts", id));
        if(snap.exists()) {
            const data = snap.data();
            document.getElementById('pName').innerText = data.name;
            document.getElementById('pImg').src = data.image;
            document.getElementById('pStory').innerText = data.story;
            document.getElementById('pMeta').innerText = `${data.genre} | ${data.date} | ${data.type}`;
            
            const epsSnap = await getDocs(query(collection(db, "episodes"), where("postId", "==", id)));
            const eps = epsSnap.docs.map(d => d.data()).sort((a,b) => parseFloat(a.num) - parseFloat(b.num));
            
            document.getElementById('epGrid').innerHTML = eps.map(e => `
                <div class="ep-node" onclick="playEp('${e.stream}', '${e.download}')">Episode ${e.num}</div>
            `).join('');
            if(eps.length > 0) playEp(eps[0].stream, eps[0].download);
        }
    }

    window.playEp = (s, d) => { document.getElementById('videoPlayer').src = s; selectedEpData = d; document.getElementById('dlArea').innerHTML = ''; };

    // GENIUS ORIGINAL BYPASS LOGIC
    function makeUniqueUrl(original) {
        const hashIndex = original.indexOf('#');
        let hash = "", base = original;
        if (hashIndex !== -1) { hash = original.substring(hashIndex); base = original.substring(0, hashIndex); }
        const dailyId = Math.floor(Date.now() / 86400000);
        return base + (base.includes('?') ? '&' : '?') + "asi_uid=" + dailyId + hash;
    }

    window.checkAccess = async () => {
        if(!selectedEpData) return alert("Select Episode!");
        const tg = document.getElementById('tgId').value.trim();
        const area = document.getElementById('dlArea');
        area.innerHTML = `Checking...`;
        
        // 1. Premium Check
        if(tg !== "") {
            const pSnap = await getDocs(query(collection(db, "premium"), where("tgId", "==", tg)));
            if(!pSnap.empty && pSnap.docs[0].data().expiry > Date.now()) {
                area.innerHTML = `<a href="${selectedEpData}" target="_blank" class="btn-save" style="background:#22c55e; text-decoration:none;">✅ Premium Direct Link</a>`;
                return;
            }
        }
        
        // 2. Shortener + Form Submit Logic
        try {
            const setSnap = await getDoc(doc(db, "settings", "shorteners"));
            const sList = setSnap.data().list;
            const rand = sList[Math.floor(Math.random() * sList.length)];
            
            const bypassedLink = makeUniqueUrl(selectedEpData);
            const apiUrl = `${rand.url}?api=${rand.key}&url=${encodeURIComponent(bypassedLink)}&format=text`;
            
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`);
            const finalLink = await res.text();
            
            if(finalLink && finalLink.startsWith('http')) {
                area.innerHTML = `<button onclick="submitForm('${finalLink}')" class="btn-save" style="max-width:300px;">Download via Shortener</button>`;
            } else {
                area.innerHTML = "Shortener API Error.";
            }
        } catch(e) { area.innerHTML = "Error connecting to Shortener."; }
    };

    window.submitForm = (link) => {
        const form = document.createElement('form');
        form.method = "GET"; form.action = link; form.target = "_blank";
        document.body.appendChild(form); form.submit(); document.body.removeChild(form);
    };

    load();
</script>
</body>
</html>
