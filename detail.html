<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watch Online | Anime Sub Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header><a href="index.html" class="logo">ANIME <span>SUB STUDIO</span></a></header>

<div class="container" style="max-width: 1000px; margin: auto; padding: 20px;">
    <div class="player-wrapper">
        <iframe id="mainPlayer" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
    </div>

    <div style="display:flex; gap:20px; margin-top:25px; flex-wrap:wrap;">
        <img id="pImg" style="width:200px; border-radius:12px; border:1px solid var(--border);">
        <div style="flex:1; min-width:280px;">
            <h1 id="pName" style="margin:0; color:var(--primary); font-size:28px;">Loading...</h1>
            <p id="pMeta" style="color:var(--text-dim); margin:10px 0; font-weight:bold;"></p>
            <p id="pStory" style="color:#cbd5e1; line-height:1.7; background:#111115; padding:15px; border-radius:12px; border:1px solid var(--border);"></p>
        </div>
    </div>

    <div class="widget" style="margin-top:30px;">
        <div class="widget-title"><i class="fas fa-list"></i> Select Episode</div>
        <div id="epGrid" class="ep-selector" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap:10px;"></div>
    </div>

    <div class="premium-shield">
        <h3 style="color:var(--primary); margin:0 0 10px 0;">🚀 Direct Download (No Ads)</h3>
        <p style="font-size:13px; color:var(--text-dim);">Premium users enter Telegram ID. Free users will use Shortener links.</p>
        <div style="display:flex; justify-content:center; gap:10px; margin-top:15px; flex-wrap:wrap;">
            <input type="text" id="tgInput" placeholder="Enter Telegram ID" style="max-width:300px; text-align:center;">
            <button class="btn-save" style="width:auto; padding:12px 30px;" onclick="checkAccess()">Get Download Link</button>
        </div>
        <div id="dlLinkArea" style="margin-top:20px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBhDMFJS5CuQN5H8T_FuSWzz8xau2qSv0I",
        authDomain: "animesubstudio.firebaseapp.com",
        projectId: "animesubstudio",
        storageBucket: "animesubstudio.firebasestorage.app",
        messagingSenderId: "580159107279",
        appId: "1:580159107279:web:8e5ea97ea6b591336947ba"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const urlId = new URLSearchParams(window.location.search).get('id');
    let animeData = null;
    let currentEp = null;

    async function load() {
        if(!urlId) return;
        const snap = await getDoc(doc(db, "posts", urlId));
        if(snap.exists()) {
            animeData = snap.data();
            document.getElementById('pName').innerText = animeData.name;
            document.getElementById('pImg').src = animeData.image;
            document.getElementById('pStory').innerText = animeData.story;
            document.getElementById('pMeta').innerText = `${animeData.genre} | Released: ${animeData.date} | ${animeData.type}`;
            
            const q = query(collection(db, "episodes"), where("postId", "==", urlId));
            const eSnap = await getDocs(q);
            const eps = eSnap.docs.map(d => d.data()).sort((a,b) => a.num - b.num);
            
            const grid = document.getElementById('epGrid');
            grid.innerHTML = eps.map(e => `
                <div class="ep-node" onclick="play('${e.stream}', '${e.download}')">Ep ${e.num}</div>
            `).join('');
            if(eps.length > 0) play(eps[0].stream, eps[0].download);
        }
    }

    window.play = (s, d) => {
        document.getElementById('mainPlayer').src = s;
        currentEp = d;
        document.getElementById('dlLinkArea').innerHTML = '';
    };

    window.checkAccess = async () => {
        if(!currentEp) return alert("Select Episode!");
        const tg = document.getElementById('tgInput').value.trim();
        const area = document.getElementById('dlLinkArea');
        
        if(tg !== "") {
            const q = query(collection(db, "premium"), where("tgId", "==", tg));
            const pSnap = await getDocs(q);
            if(!pSnap.empty && pSnap.docs[0].data().expiry > Date.now()) {
                area.innerHTML = `<a href="${currentEp}" target="_blank" class="btn-save" style="background:#22c55e; text-decoration:none;">✅ Premium Download Unlocked</a>`;
                return;
            }
        }
        
        // Shortener Rotation
        const setSnap = await getDoc(doc(db, "settings", "shorteners"));
        const sList = setSnap.data().list;
        const rand = sList[Math.floor(Math.random() * sList.length)];
        const finalLink = `${rand.u}?api=${rand.k}&url=${encodeURIComponent(currentEp)}`;
        area.innerHTML = `<a href="${finalLink}" target="_blank" class="btn-save" style="text-decoration:none;">Free Download (Ads)</a>`;
    };
    load();
</script>
</body>
</html>
