<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Episode | Hindi Sub Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .box { max-width: 800px; margin: 40px auto; background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
        .player { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 10px; display: none; margin-bottom: 20px; }
        .premium-box { background: #111; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px dashed var(--primary); }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color:var(--primary); margin-bottom:20px;">📺 Episode Stream</h2>

    <!-- Password Lock -->
    <div id="passSection">
        <h3>🔒 Video is Locked</h3>
        <p style="color:gray; font-size:13px; margin:10px 0;">Enter Daily Password to watch online.</p>
        <input type="text" id="passInput" placeholder="Enter Password" style="max-width:300px; text-align:center;">
        <button class="btn" style="max-width:300px;" onclick="checkPass()">Unlock Video</button>
        <br><br>
        <a href="https://t.me/hindisubinganime" target="_blank" style="color:var(--primary);">👉 Click to Get Password</a>
    </div>

    <!-- Player -->
    <iframe id="videoPlayer" class="player" allowfullscreen></iframe>

    <!-- Download Section -->
    <div id="downSection" style="display:none; margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
        <h3>📥 Download Episode</h3>
        
        <div class="premium-box">
            <h4 style="color:gold;">VIP Direct Download</h4>
            <input type="text" id="vipToken" placeholder="Enter VIP Token" style="max-width:250px; text-align:center;">
            <button class="btn btn-green" style="max-width:250px;" onclick="checkPremium()">Download</button>
            <p id="vipMsg" style="margin-top:10px; font-size:12px;"></p>
        </div>

        <p style="margin:10px 0; font-weight:bold;">OR</p>

        <button class="btn" id="freeBtn" onclick="generateShortener()">Free Download (Ad Link)</button>
        <p id="freeMsg" style="margin-top:10px; color:var(--primary);"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const app = initializeApp({ apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A", authDomain: "animesubstudio-256ec.firebaseapp.com", projectId: "animesubstudio-256ec", storageBucket: "animesubstudio-256ec.firebasestorage.app", messagingSenderId: "439418566080", appId: "1:439418566080:web:6c27313bb4f2e76a2a4425" });
    const db = getFirestore(app);
    const epId = new URLSearchParams(window.location.search).get('epId');
    let epData = null; let globalPass = ""; let shortList =[];

    async function load() {
        if(!epId) return;
        const eSnap = await getDoc(doc(db, "episodes", epId));
        if(eSnap.exists()) epData = eSnap.data();

        const sSnap = await getDoc(doc(db, "settings", "main"));
        if(sSnap.exists()) {
            globalPass = sSnap.data().globalPassword;
            shortList = sSnap.data().shorteners ||[];
        }
    }

    window.checkPass = () => {
        if(document.getElementById('passInput').value === globalPass) {
            document.getElementById('passSection').style.display = 'none';
            document.getElementById('videoPlayer').src = epData.live; // This MUST be SeekStreaming link
            document.getElementById('videoPlayer').style.display = 'block';
            document.getElementById('downSection').style.display = 'block';
        } else alert("Wrong Password!");
    };

    window.checkPremium = async () => {
        const token = document.getElementById('vipToken').value.trim();
        const msg = document.getElementById('vipMsg');
        if(!token) return;

        let devId = localStorage.getItem('hss_dev');
        if(!devId) { devId = "D-" + Math.random().toString(36).substr(2,8); localStorage.setItem('hss_dev', devId); }

        msg.innerText = "Checking...";
        const snap = await getDocs(query(collection(db, "premium"), where("token", "==", token)));
        
        if(!snap.empty) {
            const data = snap.docs[0].data();
            if(data.expiry < Date.now()) return msg.innerHTML = "<span style='color:red;'>Token Expired!</span>";
            if(!data.lockedDevice || data.lockedDevice === devId) {
                if(!data.lockedDevice) await setDoc(doc(db, "premium", snap.docs[0].id), { lockedDevice: devId }, { merge: true });
                msg.innerHTML = "Success! Opening direct link...";
                window.open(epData.down, "_blank"); // Telegram download link opens here
            } else msg.innerHTML = "<span style='color:red;'>Token locked to another device!</span>";
        } else msg.innerHTML = "<span style='color:red;'>Invalid Token!</span>";
    };

    // YOUR EXACT ORIGINAL SHORTENER LOGIC
    function makeUniqueUrl(original) {
        const hashIndex = original.indexOf('#');
        let hash = "", base = original;
        if (hashIndex !== -1) { hash = original.substring(hashIndex); base = original.substring(0, hashIndex); }
        const dailyId = Math.floor(Date.now() / 86400000);
        return base + (base.includes('?') ? '&' : '?') + "asi_uid=" + dailyId + hash;
    }

    window.generateShortener = async () => {
        const msg = document.getElementById('freeMsg');
        if(shortList.length === 0) return msg.innerText = "Shortener API not set!";
        msg.innerText = "Loading Link...";

        const rand = shortList[Math.floor(Math.random() * shortList.length)];
        const bypassedLink = makeUniqueUrl(epData.down); // Bypassing logic applied to telegram link
        const apiUrl = `${rand.url}?api=${rand.key}&url=${encodeURIComponent(bypassedLink)}&format=text`;

        try {
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`);
            const finalLink = await res.text();
            
            if(finalLink && finalLink.startsWith('http')) {
                const form = document.createElement('form');
                form.method = "GET"; form.action = finalLink; form.target = "_blank";
                document.body.appendChild(form); form.submit(); document.body.removeChild(form);
                msg.innerText = "Redirected!";
            } else msg.innerText = "API Error. Link generation failed.";
        } catch(e) { msg.innerText = "Server Error. Turn off Ad-Blocker."; }
    };

    load();
</script>
</body>
</html>
