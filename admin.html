<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master Admin | Studio Control</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
</head>
<body style="padding:30px;">
    <div id="loginBox" class="widget" style="max-width:400px; margin:auto;">
        <h2 style="text-align:center; color:var(--primary);">🔐 Studio Admin</h2>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()" class="btn-save">Access Dashboard</button>
    </div>

    <div id="adminPanel" style="display:none;">
        <div style="display:flex; gap:10px; margin-bottom:25px; flex-wrap:wrap;">
            <button onclick="tab('add')">Add Post</button>
            <button onclick="tab('man')">Manage Posts</button>
            <button onclick="tab('eps')">Manage Episodes</button>
            <button onclick="tab('sh')">Shortener Slots</button>
            <button onclick="tab('pre')">Add Premium</button>
        </div>

        <!-- TAB: ADD POST -->
        <div id="add" class="widget adm-tab">
            <h3>🎬 Create New Post</h3>
            <input id="aName" placeholder="Anime/Drama Name">
            <input id="aGenre" placeholder="Genre (e.g. Action, Romance)">
            <input id="aDate" placeholder="Release Year">
            <select id="aType">
                <option>Anime Hindi Sub</option><option>Anime Hindi Dub</option>
                <option>K-Drama</option><option>Movies</option><option>Series</option>
            </select>
            <button onclick="uploadImg()" style="background:#222; margin:10px 0;">🖼️ Upload Poster (Cloudinary)</button>
            <input type="hidden" id="aImg">
            <textarea id="aStory" rows="5" placeholder="Anime Synopsis/Story"></textarea>
            <button onclick="savePost()" class="btn-save">Publish Now</button>
        </div>

        <!-- TAB: MANAGE POSTS -->
        <div id="man" class="widget adm-tab" style="display:none">
            <h3>🗑️ Delete/Manage Posts</h3>
            <div id="postDelList"></div>
        </div>

        <!-- TAB: MANAGE EPISODES -->
        <div id="eps" class="widget adm-tab" style="display:none">
            <h3>📺 Add Episode</h3>
            <select id="selPost" onchange="loadEps()"><option value="">Select Anime First</option></select>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:15px 0;">
                <input id="eNum" type="number" placeholder="Ep No">
                <input id="eStream" placeholder="DoodStream Link">
                <input id="eDl" placeholder="Download Link">
            </div>
            <button onclick="saveEp()" class="btn-save">Add Episode</button>
            <hr><div id="curEpList"></div>
        </div>

        <!-- TAB: SHORTENER SLOTS -->
        <div id="sh" class="widget adm-tab" style="display:none">
            <h3>🔗 3-Shortener Rotation</h3>
            <div style="display:grid; gap:10px;">
                <div style="display:flex; gap:10px;"><input id="s1k" placeholder="API Key 1"><input id="s1u" placeholder="Base URL 1"></div>
                <div style="display:flex; gap:10px;"><input id="s2k" placeholder="API Key 2"><input id="s2u" placeholder="Base URL 2"></div>
                <div style="display:flex; gap:10px;"><input id="s3k" placeholder="API Key 3"><input id="s3u" placeholder="Base URL 3"></div>
            </div>
            <button onclick="saveSh()" class="btn-save" style="margin-top:15px;">Save Rotation Settings</button>
        </div>

        <!-- TAB: PREMIUM -->
        <div id="pre" class="widget adm-tab" style="display:none">
            <h3>💎 Activate Premium (28 Days)</h3>
            <input id="tgId" placeholder="User Telegram ID">
            <button onclick="savePre()" class="btn-save">Activate 28 Days Access</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBhDMFJS5CuQN5H8T_FuSWzz8xau2qSv0I",
        authDomain: "animesubstudio.firebaseapp.com",
        projectId: "animesubstudio",
        storageBucket: "animesubstudio.firebasestorage.app",
        messagingSenderId: "580159107279",
        appId: "1:580159107279:web:8e5ea97ea6b591336947ba"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.login = () => {
        signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
        .then(() => { 
            document.getElementById('loginBox').style.display='none'; 
            document.getElementById('adminPanel').style.display='block'; 
            loadSelect(); 
        }).catch(e => alert(e.message));
    };

    window.tab = (id) => {
        document.querySelectorAll('.adm-tab').forEach(t => t.style.display='none');
        document.getElementById(id).style.display='block';
        if(id==='man') loadDel();
    };

    window.uploadImg = () => {
        cloudinary.openUploadWidget({ cloudName: "dmxqosmk0", uploadPreset: "asi_upload" }, (err, res) => {
            if(!err && res.event === "success") {
                document.getElementById('aImg').value = res.info.secure_url;
                alert("Image Uploaded!");
            }
        });
    };

    window.savePost = async () => {
        await addDoc(collection(db, "posts"), {
            name: document.getElementById('aName').value,
            genre: document.getElementById('aGenre').value,
            date: document.getElementById('aDate').value,
            type: document.getElementById('aType').value,
            story: document.getElementById('aStory').value,
            image: document.getElementById('aImg').value,
            createdAt: Date.now()
        });
        alert("Published!");
    };

    window.loadDel = async () => {
        const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
        document.getElementById('postDelList').innerHTML = snap.docs.map(d => `
            <div style="padding:12px; background:#000; margin-bottom:8px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <span>${d.data().name}</span>
                <button onclick="delPost('${d.id}')" style="background:red; padding:5px 12px; font-size:12px;">Delete</button>
            </div>
        `).join('');
    };

    window.delPost = async (id) => {
        if(confirm("Delete this Post and all Episodes?")) {
            await deleteDoc(doc(db, "posts", id));
            loadDel();
        }
    };

    window.loadSelect = async () => {
        const snap = await getDocs(collection(db, "posts"));
        const sel = document.getElementById('selPost');
        sel.innerHTML = '<option value="">Select Anime</option>';
        snap.forEach(d => sel.innerHTML += `<option value="${d.id}">${d.data().name}</option>`);
    };

    window.saveEp = async () => {
        await addDoc(collection(db, "episodes"), {
            postId: document.getElementById('selPost').value,
            num: document.getElementById('eNum').value,
            stream: document.getElementById('eStream').value,
            download: document.getElementById('eDl').value
        });
        alert("Episode Added!"); loadEps();
    };

    window.loadEps = async () => {
        const pid = document.getElementById('selPost').value;
        const q = query(collection(db, "episodes"), where("postId", "==", pid));
        const snap = await getDocs(q);
        document.getElementById('curEpList').innerHTML = snap.docs.map(e => `
            <div style="padding:8px; background:#000; margin-bottom:5px; border-radius:5px; display:flex; justify-content:space-between;">
                <span>Ep ${e.data().num}</span>
                <button onclick="delEp('${e.id}')" style="background:red; padding:3px 8px; font-size:10px;">X</button>
            </div>
        `).join('');
    };

    window.delEp = async (id) => {
        await deleteDoc(doc(db, "episodes", id));
        loadEps();
    };

    window.saveSh = async () => {
        const list = [
            {k: document.getElementById('s1k').value, u: document.getElementById('s1u').value},
            {k: document.getElementById('s2k').value, u: document.getElementById('s2u').value},
            {k: document.getElementById('s3k').value, u: document.getElementById('s3u').value}
        ].filter(x => x.k !== "");
        await setDoc(doc(db, "settings", "shorteners"), { list });
        alert("Settings Saved!");
    };

    window.savePre = async () => {
        await addDoc(collection(db, "premium"), {
            tgId: document.getElementById('tgId').value,
            expiry: Date.now() + (28 * 24 * 60 * 60 * 1000)
        });
        alert("Activated for 28 Days!");
    };
</script>
</body>
</html>
