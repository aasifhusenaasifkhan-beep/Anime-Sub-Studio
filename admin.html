<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Anime Sub Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
</head>
<body style="padding:2rem;">
<div id="loginBox" class="widget" style="max-width:400px; margin:2rem auto;">
    <h3 style="color:var(--accent); text-align:center;">🔐 Admin Login</h3>
    <input type="email" id="email" placeholder="Admin Email" style="background:white;">
    <input type="password" id="pass" placeholder="Password" style="background:white;">
    <button class="btn-save" onclick="login()" style="width:100%;">Login</button>
</div>

<div id="adminPanel" style="display:none; max-width:1000px; margin:auto;">
    <div style="display:flex; gap:0.75rem; margin-bottom:1.5rem; flex-wrap:wrap;">
        <button class="btn-save" onclick="tab('add')" style="flex:1;">Add Post</button>
        <button class="btn-save" onclick="tab('man')" style="flex:1; background:#64748b;">Delete</button>
        <button class="btn-save" onclick="tab('eps')" style="flex:1; background:#64748b;">Episodes</button>
        <button class="btn-save" onclick="tab('sh')" style="flex:1; background:#64748b;">Shorteners</button>
        <button class="btn-save" onclick="tab('pre')" style="flex:1; background:#64748b;">Premium</button>
        <button class="btn-save" onclick="tab('pwd')" style="flex:1; background:#64748b;">Password</button>
    </div>

    <div id="add" class="widget adm-tab">
        <h3>➕ New Post</h3>
        <input id="aName" placeholder="Title" style="background:white;">
        <input id="aGenre" placeholder="Genre" style="background:white;">
        <input id="aDate" placeholder="Year" style="background:white;">
        <select id="aType" style="background:white;">
            <option>Short Video</option><option>Anime</option><option>K-Drama</option><option>Movie</option><option>Series</option>
        </select>
        <button onclick="uploadImage()" class="btn-save" style="background:#334155; margin-bottom:0.75rem;">🖼️ Upload Poster (Cloudinary)</button>
        <input type="hidden" id="aImg">
        <textarea id="aStory" rows="4" placeholder="Story (optional)" style="background:white;"></textarea>
        <button class="btn-save" onclick="savePost()">Publish</button>
    </div>

    <div id="man" class="widget adm-tab" style="display:none;">
        <h3>🗑️ Manage Posts</h3><div id="pList"></div>
    </div>

    <div id="eps" class="widget adm-tab" style="display:none;">
        <h3>📺 Episodes</h3>
        <select id="selPost" onchange="loadEps()" style="background:white;"><option value="">Select Post</option></select>
        <input id="eNum" type="number" placeholder="Episode No." style="background:white;">
        <input id="eStream" placeholder="SeekStreaming Embed URL" style="background:white;">
        <input id="eDl" placeholder="Direct Download Link" style="background:white;">
        <button class="btn-save" onclick="saveEp()">Add Episode</button>
        <hr style="border-color:var(--border); margin:1rem 0;">
        <div id="curEps"></div>
    </div>

    <div id="sh" class="widget adm-tab" style="display:none;">
        <h3>🔗 Shortener APIs (3)</h3>
        <div style="display:flex; gap:0.5rem;"><input id="s1k" placeholder="API Key 1" style="background:white;"><input id="s1u" placeholder="Base URL 1" style="background:white;"></div>
        <div style="display:flex; gap:0.5rem;"><input id="s2k" placeholder="API Key 2" style="background:white;"><input id="s2u" placeholder="Base URL 2" style="background:white;"></div>
        <div style="display:flex; gap:0.5rem;"><input id="s3k" placeholder="API Key 3" style="background:white;"><input id="s3u" placeholder="Base URL 3" style="background:white;"></div>
        <button class="btn-save" onclick="saveSh()" style="margin-top:0.5rem;">Save</button>
    </div>

    <div id="pre" class="widget adm-tab" style="display:none;">
        <h3>💎 Generate Premium Token</h3>
        <button class="btn-save" onclick="generateToken()" style="background:#16a34a;">Generate 28-Day Token</button>
        <div id="newTokenDisplay" style="margin-top:1rem; font-weight:bold; font-size:1.1rem;"></div>
    </div>

    <div id="pwd" class="widget adm-tab" style="display:none;">
        <h3>🔑 Site Password (Video Unlock)</h3>
        <input id="sitePass" placeholder="New password" style="background:white;">
        <button class="btn-save" onclick="saveSitePassword()">Update</button>
        <p style="font-size:0.8rem; color:var(--text-light); margin-top:0.5rem;">Share this password in your Telegram group (@hindisubanime_q).</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAcHQjCvkE3YJIeL_mQcbr0a6nG-cC4l_A",
        authDomain: "animesubstudio-256ec.firebaseapp.com",
        projectId: "animesubstudio-256ec",
        storageBucket: "animesubstudio-256ec.firebasestorage.app",
        messagingSenderId: "439418566080",
        appId: "1:439418566080:web:6c27313bb4f2e76a2a4425"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.login = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
        .then(() => { document.getElementById('loginBox').style.display='none'; document.getElementById('adminPanel').style.display='block'; loadPostList(); })
        .catch(e => alert('Login failed: ' + e.message));

    window.tab = (id) => {
        document.querySelectorAll('.adm-tab').forEach(t => t.style.display='none');
        document.getElementById(id).style.display='block';
        if(id==='man') loadDelList();
    };

    window.uploadImage = () => cloudinary.openUploadWidget({
        cloudName: "dccbzyjtr", uploadPreset: "asi_anime_upload"
    }, (err, res) => { if(!err && res.event==="success") { document.getElementById('aImg').value = res.info.secure_url; alert('Poster uploaded!'); } });

    window.savePost = async () => {
        const n=document.getElementById('aName').value, g=document.getElementById('aGenre').value,
              d=document.getElementById('aDate').value, t=document.getElementById('aType').value,
              s=document.getElementById('aStory').value, i=document.getElementById('aImg').value;
        if(!n||!i) return alert('Title and image required!');
        await addDoc(collection(db,"posts"),{name:n,genre:g,date:d,type:t,story:s,image:i,createdAt:Date.now()});
        alert('Published!'); loadPostList();
    };

    async function loadPostList() {
        const snap = await getDocs(collection(db,"posts"));
        const sel = document.getElementById('selPost');
        sel.innerHTML = '<option value="">Select Post</option>';
        snap.forEach(d => sel.innerHTML += `<option value="${d.id}">${d.data().name}</option>`);
    }

    window.loadDelList = async () => {
        const snap = await getDocs(query(collection(db,"posts"), orderBy("createdAt","desc")));
        document.getElementById('pList').innerHTML = snap.docs.map(d => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; border:1px solid var(--border); border-radius:8px; margin-bottom:0.25rem; background:white;">
                ${d.data().name}
                <button onclick="delPost('${d.id}')" style="background:#e11d48; color:white; border:none; padding:0.25rem 1rem; border-radius:6px; cursor:pointer;">Delete</button>
            </div>`).join('');
    };

    window.delPost = async (id) => { if(confirm('Delete?')) { await deleteDoc(doc(db,"posts",id)); loadDelList(); loadPostList(); } };

    window.saveEp = async () => {
        const pid=document.getElementById('selPost').value, num=document.getElementById('eNum').value,
              stream=document.getElementById('eStream').value, dl=document.getElementById('eDl').value;
        if(!pid||!num||!stream) return alert('Fill all fields!');
        await addDoc(collection(db,"episodes"),{postId:pid,num,stream,download:dl});
        alert('Episode added!'); loadEps();
    };

    window.loadEps = async () => {
        const pid = document.getElementById('selPost').value;
        if(!pid) return;
        const snap = await getDocs(query(collection(db,"episodes"), where("postId","==",pid)));
        document.getElementById('curEps').innerHTML = snap.docs.map(e => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:0.5rem; border:1px solid var(--border); border-radius:6px; margin-bottom:0.25rem; background:white;">
                Ep ${e.data().num}
                <button onclick="delEp('${e.id}')" style="background:#e11d48; color:white; border:none; padding:0.2rem 0.8rem; border-radius:4px; cursor:pointer;">X</button>
            </div>`).join('');
    };

    window.delEp = async (id) => { await deleteDoc(doc(db,"episodes",id)); loadEps(); };

    window.saveSh = async () => {
        const list = [
            { key: document.getElementById('s1k').value, url: document.getElementById('s1u').value },
            { key: document.getElementById('s2k').value, url: document.getElementById('s2u').value },
            { key: document.getElementById('s3k').value, url: document.getElementById('s3u').value }
        ].filter(x => x.key);
        await setDoc(doc(db,"settings","shorteners"), { list });
        alert('Saved!');
    };

    window.generateToken = async () => {
        const token = "ASI-" + Math.random().toString(36).substr(2,6).toUpperCase();
        await addDoc(collection(db,"premium"),{ token, lockedDevice:null, expiry: Date.now()+28*24*60*60*1000 });
        document.getElementById('newTokenDisplay').innerText = `Token: ${token}`;
    };

    window.saveSitePassword = async () => {
        const p = document.getElementById('sitePass').value.trim();
        if(!p) return alert('Enter password!');
        await setDoc(doc(db,"settings","sitePassword"), { password: p });
        alert('Site password updated!');
    };
</script>
</body>
</html>
